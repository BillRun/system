;; Event Settings API Configuration
;; Holds event definitions (balance / fraud) that were separated out of the config db (BRCD-5355).

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;; CREATE ACTION
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
billapi.eventsettings.create.permission="write"
billapi.eventsettings.create.error_base=90000

billapi.eventsettings.create.update_parameters.0.name=type
billapi.eventsettings.create.update_parameters.0.type=string
billapi.eventsettings.create.update_parameters.0.mandatory=1

billapi.eventsettings.create.update_parameters.1.name=event_code
billapi.eventsettings.create.update_parameters.1.type=string
billapi.eventsettings.create.update_parameters.1.mandatory=1

billapi.eventsettings.create.update_parameters.2.name=from
billapi.eventsettings.create.update_parameters.2.type=datetime
billapi.eventsettings.create.update_parameters.2.mandatory=0

billapi.eventsettings.create.update_parameters.3.name=to
billapi.eventsettings.create.update_parameters.3.type=datetime
billapi.eventsettings.create.update_parameters.3.mandatory=0

billapi.eventsettings.create.update_parameters.4.name=event_description
billapi.eventsettings.create.update_parameters.4.type=string
billapi.eventsettings.create.update_parameters.4.mandatory=0

billapi.eventsettings.create.update_parameters.5.name=active
billapi.eventsettings.create.update_parameters.5.type=boolean
billapi.eventsettings.create.update_parameters.5.mandatory=0

billapi.eventsettings.create.update_parameters.6.name=conditions
billapi.eventsettings.create.update_parameters.6.type=array
billapi.eventsettings.create.update_parameters.6.mandatory=0

billapi.eventsettings.create.update_parameters.7.name=recurrence
billapi.eventsettings.create.update_parameters.7.type=array
billapi.eventsettings.create.update_parameters.7.mandatory=0

billapi.eventsettings.create.update_parameters.8.name=date_range
billapi.eventsettings.create.update_parameters.8.type=array
billapi.eventsettings.create.update_parameters.8.mandatory=0

billapi.eventsettings.create.update_parameters.9.name=notify_by_email
billapi.eventsettings.create.update_parameters.9.type=array
billapi.eventsettings.create.update_parameters.9.mandatory=0

billapi.eventsettings.create.update_parameters.10.name=key
billapi.eventsettings.create.update_parameters.10.type=string
billapi.eventsettings.create.update_parameters.10.regex='/^[A-Z0-9_]+$/'
billapi.eventsettings.create.update_parameters.10.mandatory=1


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;; UPDATE ACTION
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
billapi.eventsettings.update.permission="write"
billapi.eventsettings.update.error_base=90100

billapi.eventsettings.update.unique_query_parameters=1

billapi.eventsettings.update.update_parameters.0.name=event_description
billapi.eventsettings.update.update_parameters.0.type=string

billapi.eventsettings.update.update_parameters.1.name=active
billapi.eventsettings.update.update_parameters.1.type=boolean

billapi.eventsettings.update.update_parameters.2.name=conditions
billapi.eventsettings.update.update_parameters.2.type=array

billapi.eventsettings.update.update_parameters.3.name=recurrence
billapi.eventsettings.update.update_parameters.3.type=array

billapi.eventsettings.update.update_parameters.4.name=date_range
billapi.eventsettings.update.update_parameters.4.type=array

billapi.eventsettings.update.update_parameters.5.name=notify_by_email
billapi.eventsettings.update.update_parameters.5.type=array

billapi.eventsettings.update.update_parameters.6.name=event_code
billapi.eventsettings.update.update_parameters.6.type=string


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;; GET ACTION
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
billapi.eventsettings.get.permission="read"
billapi.eventsettings.get.error_base=90400
billapi.eventsettings.get.enable_sort=1
billapi.eventsettings.get.restrict_query=0

billapi.eventsettings.get.query_parameters.0.name=_id
billapi.eventsettings.get.query_parameters.0.type=dbid

billapi.eventsettings.get.query_parameters.1.name=type
billapi.eventsettings.get.query_parameters.1.type=string

billapi.eventsettings.get.query_parameters.2.name=event_code
billapi.eventsettings.get.query_parameters.2.type=array

billapi.eventsettings.get.query_parameters.3.name=key
billapi.eventsettings.get.query_parameters.3.type=array


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;; DELETE ACTION
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
billapi.eventsettings.delete.permission="write"
billapi.eventsettings.delete.error_base=90300

billapi.eventsettings.delete.query_parameters.0.name=_id
billapi.eventsettings.delete.query_parameters.0.type=dbid
billapi.eventsettings.delete.query_parameters.0.mandatory=1


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;; COLLECTION-WIDE SETTINGS
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

billapi.eventsettings.active_documents=1

billapi.eventsettings.collection_name="event_settings"

billapi.eventsettings.duplicate_check[string]=key
